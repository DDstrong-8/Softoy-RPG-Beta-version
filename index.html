<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Softoy World — Prototype 1.1</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #10151c;
    color: white;

    font-family: Arial, sans-serif;

    touch-action: none;
}

button {
    font-family: inherit;
    border: none;
}


/* =====================================================
   GAME
   ===================================================== */

#game {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}


/* =====================================================
   HUD
   ===================================================== */

#hud {
    position: absolute;

    top: 12px;
    left: 12px;
    right: 12px;

    z-index: 100;

    display: flex;
    justify-content: space-between;
    align-items: center;

    pointer-events: none;
}

.hud-box {
    padding: 9px 14px;

    border-radius: 16px;

    background: rgba(20,25,35,.72);

    border: 1px solid rgba(255,255,255,.2);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);

    font-size: 14px;
}

#settingsButton {
    pointer-events: auto;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    color: white;

    background: rgba(20,25,35,.72);

    border: 1px solid rgba(255,255,255,.2);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    font-size: 21px;
}


/* =====================================================
   WORLD
   ===================================================== */

#world {
    position: absolute;

    width: 2400px;
    height: 1600px;

    left: 0;
    top: 0;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(255,255,255,.12) 0 4px,
            transparent 5px
        ),

        radial-gradient(
            circle at 70% 70%,
            rgba(255,255,255,.10) 0 3px,
            transparent 4px
        ),

        linear-gradient(
            135deg,
            #91d47b,
            #6db268
        );

    background-size:
        150px 150px,
        210px 210px,
        auto;

    will-change: transform;
}


/* =====================================================
   PATHS
   ===================================================== */

.path {
    position: absolute;

    background: #d6b982;

    border-radius: 50px;

    opacity: .9;
}

.path.horizontal {
    height: 85px;
}

.path.vertical {
    width: 85px;
}


/* =====================================================
   PILLOW LAND
   ===================================================== */

.pillow {
    position: absolute;

    border-radius: 50%;

    background: rgba(255,255,255,.25);

    box-shadow:
        inset 0 -20px 30px rgba(0,0,0,.08);
}

.pillow1 {
    width: 360px;
    height: 200px;

    left: 250px;
    top: 180px;
}

.pillow2 {
    width: 280px;
    height: 160px;

    left: 1050px;
    top: 300px;
}

.pillow3 {
    width: 420px;
    height: 220px;

    left: 1500px;
    top: 900px;
}


/* =====================================================
   TREES
   ===================================================== */

.tree {
    position: absolute;

    width: 55px;
    height: 70px;

    border-radius: 50%;

    background: #397a45;

    border: 5px solid #24552e;

    box-shadow:
        inset 0 -10px 15px rgba(0,0,0,.15);
}


/* =====================================================
   VILLAGE
   ===================================================== */

#village {
    position: absolute;

    left: 1120px;
    top: 750px;

    width: 230px;
    height: 170px;

    border-radius: 28px;

    background: #dcb77d;

    border: 6px solid #8b633d;

    color: #4c3522;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-weight: bold;

    font-size: 18px;
}


/* =====================================================
   LOST CAVES
   ===================================================== */

#cave {
    position: absolute;

    left: 330px;
    top: 1080px;

    width: 130px;
    height: 95px;

    border-radius:
        60px 60px 25px 25px;

    background: #242424;

    border: 6px solid #111;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: 13px;
}


/* =====================================================
   ENEMIES
   ===================================================== */

.enemy {
    position: absolute;

    width: 55px;
    height: 55px;

    border-radius: 50%;

    background: #c94c4c;

    border: 5px solid #641e1e;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 28px;

    z-index: 10;
}

.enemy.green {
    outline: 4px solid #35d46b;
}

.enemy.yellow {
    outline: 4px solid #f1d344;
}

.enemy.red {
    outline: 4px solid #e74c3c;
}


/* =====================================================
   PLAYER
   ===================================================== */

#player {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 64px;
    height: 64px;

    border-radius:
        50% 50% 45% 45%;

    background: #f5f5f5;

    border: 5px solid #202020;

    z-index: 200;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 34px;

    box-shadow:
        0 8px 18px rgba(0,0,0,.3);
}


/* =====================================================
   MODERN JOYSTICK
   ===================================================== */

#joystick {
    position: absolute;

    left: 28px;
    bottom: 28px;

    width: 155px;
    height: 155px;

    z-index: 250;

    border-radius: 50%;

    background:
        rgba(255,255,255,.10);

    border:
        2px solid rgba(255,255,255,.25);

    box-shadow:
        inset 0 0 25px rgba(255,255,255,.08),
        0 10px 35px rgba(0,0,0,.22);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    display: flex;

    align-items: center;
    justify-content: center;

    touch-action: none;

    transition:
        opacity .2s ease;
}


/* joystick ring */

#joystick::before {
    content: "";

    position: absolute;

    width: 112px;
    height: 112px;

    border-radius: 50%;

    border:
        1px solid rgba(255,255,255,.16);
}


/* joystick thumb */

#joystickThumb {
    position: absolute;

    width: 68px;
    height: 68px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.28);

    border:
        2px solid rgba(255,255,255,.45);

    box-shadow:
        inset 0 0 18px rgba(255,255,255,.15),
        0 8px 20px rgba(0,0,0,.25);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    transform:
        translate(0px, 0px);

    transition:
        background .15s ease;
}

#joystick.active {
    background:
        rgba(255,255,255,.16);
}

#joystick.active #joystickThumb {
    background:
        rgba(255,255,255,.38);
}


/* =====================================================
   BATTLE SCREEN
   ===================================================== */

#battleScreen {
    position: absolute;

    inset: 0;

    z-index: 500;

    display: none;

    background:
        linear-gradient(
            rgba(25,35,50,.25),
            rgba(20,25,35,.7)
        ),
        linear-gradient(
            135deg,
            #9fc9e6,
            #526f91
        );
}

.battleEnemy {
    position: absolute;

    top: 18%;
    right: 17%;

    width: 140px;
    height: 140px;

    border-radius: 50%;

    background: #c94c4c;

    border: 8px solid #651e1e;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 70px;

    box-shadow:
        0 20px 35px rgba(0,0,0,.3);
}

.battlePlayer {
    position: absolute;

    bottom: 31%;
    left: 16%;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background: #f5f5f5;

    border: 8px solid #222;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 75px;

    box-shadow:
        0 20px 35px rgba(0,0,0,.3);
}


/* =====================================================
   BATTLE INFO
   ===================================================== */

.battleInfo,
.enemyInfo {
    position: absolute;

    background:
        rgba(15,20,28,.88);

    border:
        1px solid rgba(255,255,255,.15);

    border-radius: 16px;

    padding: 13px;

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.battleInfo {
    left: 7%;
    top: 12%;
}

.enemyInfo {
    right: 5%;
    top: 7%;
}

.name {
    font-weight: bold;
    margin-bottom: 7px;
}

.bar {
    width: 180px;
    height: 13px;

    background: #1d2027;

    border-radius: 10px;

    overflow: hidden;
}

.bar-fill {
    width: 100%;
    height: 100%;

    background: #53d36c;
}

.energy-fill {
    background: #4ca9e8;
}


/* =====================================================
   BATTLE MESSAGE
   ===================================================== */

#battleMessage {
    position: absolute;

    left: 50%;
    bottom: 160px;

    transform:
        translateX(-50%);

    width: min(90%, 650px);

    padding: 15px;

    border-radius: 15px;

    background:
        rgba(10,12,18,.94);

    border:
        1px solid rgba(255,255,255,.2);

    text-align: center;
}


/* =====================================================
   BATTLE MENU
   ===================================================== */

#battleMenu {
    position: absolute;

    bottom: 0;
    left: 0;
    right: 0;

    padding: 14px;

    background:
        rgba(12,15,22,.95);

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;
}

.battleButton {
    min-height: 58px;

    border-radius: 14px;

    background: #303847;

    color: white;

    border:
        1px solid rgba(255,255,255,.15);

    font-size: 16px;
}

.battleButton:active {
    transform: scale(.96);
}


/* =====================================================
   SETTINGS
   ===================================================== */

#settingsPanel {
    position: absolute;

    inset: 0;

    z-index: 700;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,.6);
}

.settingsCard {
    width: min(90%, 400px);

    padding: 25px;

    border-radius: 22px;

    background: #202633;

    text-align: center;
}

.settingButton {
    width: 100%;

    padding: 14px;

    margin-top: 10px;

    border-radius: 13px;

    background: #343d50;

    color: white;

    font-size: 16px;
}


/* =====================================================
   NOTIFICATION
   ===================================================== */

#notification {
    position: absolute;

    left: 50%;
    top: 85px;

    transform:
        translateX(-50%);

    z-index: 800;

    display: none;

    padding: 12px 18px;

    border-radius: 14px;

    background:
        rgba(20,25,35,.95);

    border:
        1px solid rgba(255,255,255,.2);

    white-space: nowrap;
}

</style>
</head>


<body>

<div id="game">

<script>

/* =====================================================
   PLAYER DATA
   ===================================================== */

const player = {

    worldX: 1200,
    worldY: 800,

    movementSpeed: 5,

    maxHP: 100,
    hp: 100,

    attack: 20,
    defense: 5,
    speedStat: 30,

    energy: 100,
    maxEnergy: 100,

    level: 1,
    exp: 0,

    coins: 0

};


let currentEnemy = null;

let enemyHP = 100;
let enemyMaxHP = 100;

let enemyAttack = 15;
let enemyDefense = 3;

let defending = false;

let musicOn = false;


/* =====================================================
   ELEMENTS
   ===================================================== */

const world =
    document.getElementById("world");

const playerElement =
    document.getElementById("player");

const joystick =
    document.getElementById("joystick");

const joystickThumb =
    document.getElementById("joystickThumb");

const battleScreen =
    document.getElementById("battleScreen");


/* =====================================================
   WORLD CAMERA
   ===================================================== */

function updateCamera() {

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;


    /*
       Keep the player centred.
       Move the entire world in the
       opposite direction.
    */

    let worldX =
        screenWidth / 2 -
        player.worldX;

    let worldY =
        screenHeight / 2 -
        player.worldY;


    const minX =
        screenWidth - 2400;

    const minY =
        screenHeight - 1600;


    worldX =
        Math.min(
            0,
            Math.max(
                minX,
                worldX
            )
        );

    worldY =
        Math.min(
            0,
            Math.max(
                minY,
                worldY
            )
        );


    world.style.transform =
        `translate(${worldX}px, ${worldY}px)`;

}


/* =====================================================
   JOYSTICK VARIABLES
   ===================================================== */

let joystickActive = false;

let joystickPointerID = null;

let joystickX = 0;
let joystickY = 0;

const joystickRadius = 55;


/* =====================================================
   JOYSTICK START
   ===================================================== */

joystick.addEventListener(
    "pointerdown",
    event => {

        if (
            battleScreen.style.display === "block"
        ) {
            return;
        }

        joystickActive = true;

        joystickPointerID =
            event.pointerId;

        joystick.setPointerCapture(
            event.pointerId
        );

        joystick.classList.add(
            "active"
        );

        updateJoystick(
            event
        );

    }
);


/* =====================================================
   JOYSTICK MOVE
   ===================================================== */

joystick.addEventListener(
    "pointermove",
    event => {

        if (
            !joystickActive ||
            event.pointerId !==
            joystickPointerID
        ) {
            return;
        }

        updateJoystick(
            event
        );

    }
);


/* =====================================================
   JOYSTICK CALCULATION
   ===================================================== */

function updateJoystick(event) {

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        event.clientX -
        centerX;

    let dy =
        event.clientY -
        centerY;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    if (
        distance >
        joystickRadius
    ) {

        dx =
            dx /
            distance *
            joystickRadius;

        dy =
            dy /
            distance *
            joystickRadius;

    }


    joystickX =
        dx /
        joystickRadius;

    joystickY =
        dy /
        joystickRadius;


    joystickThumb.style.transform =
        `translate(${dx}px, ${dy}px)`;

}


/* =====================================================
   JOYSTICK END
   ===================================================== */

function stopJoystick() {

    joystickActive = false;

    joystickPointerID = null;

    joystickX = 0;
    joystickY = 0;

    joystickThumb.style.transform =
        "translate(0px, 0px)";

    joystick.classList.remove(
        "active"
    );

}


joystick.addEventListener(
    "pointerup",
    stopJoystick
);

joystick.addEventListener(
    "pointercancel",
    stopJoystick
);

joystick.addEventListener(
    "lostpointercapture",
    stopJoystick
);


/* =====================================================
   GAME LOOP
   ===================================================== */

let lastTime =
    performance.now();


function gameLoop(time) {

    const delta =
        Math.min(
            40,
            time - lastTime
        );

    lastTime =
        time;


    if (
        joystickActive &&
        battleScreen.style.display !== "block"
    ) {

        moveWorld(
            delta
        );

    }


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);


/* =====================================================
   MOVE WORLD
   ===================================================== */

function moveWorld(delta) {

    const movement =
        player.movementSpeed *
        delta /
        16.67;


    player.worldX +=
        joystickX *
        movement;

    player.worldY +=
        joystickY *
        movement;


    /*
       World boundaries
    */

    player.worldX =
        Math.max(
            30,
            Math.min(
                2370,
                player.worldX
            )
        );

    player.worldY =
        Math.max(
            30,
            Math.min(
                1570,
                player.worldY
            )
        );


    updateCamera();

    checkEnemyCollision();

}


/* =====================================================
   ENEMY COLLISION
   ===================================================== */

function checkEnemyCollision() {

    const enemies =
        document.querySelectorAll(
            ".enemy"
        );


    enemies.forEach(
        enemy => {

            if (
                enemy.style.display ===
                "none"
            ) {
                return;
            }


            const x =
                parseFloat(
                    enemy.style.left
                );

            const y =
                parseFloat(
                    enemy.style.top
                );


            const distance =
                Math.hypot(
                    player.worldX -
                    x,

                    player.worldY -
                    y
                );


            if (
                distance < 65
            ) {

                startBattle(
                    enemy
                );

            }

        }
    );

}


/* =====================================================
   START BATTLE
   ===================================================== */

function startBattle(enemy) {

    currentEnemy =
        enemy;


    const level =
        Number(
            enemy.dataset.level
        );


    enemyMaxHP =
        70 +
        level * 5;

    enemyHP =
        enemyMaxHP;


    enemyAttack =
        8 +
        level * 2;

    enemyDefense =
        Math.floor(
            level / 2
        );


    defending = false;


    document.getElementById(
        "battleEnemyLevel"
    ).textContent =
        "?";


    battleScreen.style.display =
        "block";


    showBattleMessage(
        "A wild enemy appeared!"
    );


    updateBattleUI();

}


/* =====================================================
   BATTLE UI
   ===================================================== */

function updateBattleUI() {

    document.getElementById(
        "battlePlayerHP"
    ).textContent =
        player.hp;


    document.getElementById(
        "battleEnergy"
    ).textContent =
        player.energy;


    document.getElementById(
        "enemyHPBar"
    ).style.width =
        (
            enemyHP /
            enemyMaxHP *
            100
        ) + "%";


    document.getElementById(
        "playerHPBar"
    ).style.width =
        (
            player.hp /
            player.maxHP *
            100
        ) + "%";


    document.getElementById(
        "energyBar"
    ).style.width =
        (
            player.energy /
            player.maxEnergy *
            100
        ) + "%";

}


/* =====================================================
   BATTLE MESSAGE
   ===================================================== */

function showBattleMessage(
    message
) {

    document.getElementById(
        "battleMessage"
    ).textContent =
        message;

}


/* =====================================================
   ATTACK
   ===================================================== */

document.getElementById(
    "attackButton"
).onclick = () => {

    const damage =
        Math.max(
            1,
            player.attack -
            enemyDefense
        );


    enemyHP -=
        damage;


    showBattleMessage(
        `Hechie dealt ${damage} damage!`
    );


    updateBattleUI();


    if (
        enemyHP <= 0
    ) {

        winBattle();

        return;

    }


    setTimeout(
        enemyTurn,
        650
    );

};


/* =====================================================
   DEFEND
   ===================================================== */

document.getElementById(
    "defendButton"
).onclick = () => {

    defending = true;


    showBattleMessage(
        "Hechie is defending!"
    );


    setTimeout(
        enemyTurn,
        650
    );

};


/* =====================================================
   ABILITY
   ===================================================== */

document.getElementById(
    "abilityButton"
).onclick = () => {

    const cost = 20;


    if (
        player.energy <
        cost
    ) {

        showBattleMessage(
            "Not enough Energy!"
        );

        return;

    }


    player.energy -=
        cost;


    const damage =
        Math.max(
            1,
            Math.floor(
                player.attack * 1.8
                -
                enemyDefense
            )
        );


    enemyHP -=
        damage;


    showBattleMessage(
        `Power Strike dealt ${damage} damage!`
    );


    updateBattleUI();


    if (
        enemyHP <= 0
    ) {

        winBattle();

        return;

    }


    setTimeout(
        enemyTurn,
        650
    );

};


/* =====================================================
   ITEM
   ===================================================== */

document.getElementById(
    "itemButton"
).onclick = () => {

    if (
        player.hp >=
        player.maxHP
    ) {

        showBattleMessage(
            "HP is already full!"
        );

        return;

    }


    player.hp =
        Math.min(
            player.maxHP,
            player.hp + 50
        );


    showBattleMessage(
        "Health Potion restored 50 HP!"
    );


    updateBattleUI();


    setTimeout(
        enemyTurn,
        650
    );

};


/* =====================================================
   RUN
   ===================================================== */

document.getElementById(
    "runButton"
).onclick = () => {

    /*
       Temporary prototype rule:
       60% chance.
    */

    if (
        Math.random() < .6
    ) {

        showBattleMessage(
            "You escaped!"
        );


        setTimeout(
            endBattle,
            600
        );

    } else {

        showBattleMessage(
            "You couldn't escape!"
        );


        setTimeout(
            enemyTurn,
            650
        );

    }

};


/* =====================================================
   ENEMY TURN
   ===================================================== */

function enemyTurn() {

    if (
        enemyHP <= 0
    ) {
        return;
    }


    let damage =
        Math.max(
            1,
            enemyAttack -
            player.defense
        );


    if (
        defending
    ) {

        damage =
            Math.max(
                1,
                Math.floor(
                    damage / 2
                )
            );

    }


    player.hp -=
        damage;


    defending = false;


    showBattleMessage(
        `Enemy dealt ${damage} damage!`
    );


    updateBattleUI();


    if (
        player.hp <= 0
    ) {

        player.hp =
            1;


        showBattleMessage(
            "Hechie was knocked out!"
        );


        setTimeout(
            gameOver,
            900
        );

    }

}


/* =====================================================
   WIN
   ===================================================== */

function winBattle() {

    const level =
        Number(
            currentEnemy.dataset.level
        );


    const exp =
        level * 10;


    const coins =
        10 +
        level * 3;


    player.exp +=
        exp;

    player.coins +=
        coins;


    currentEnemy.style.display =
        "none";


    showBattleMessage(
        `Victory! +${exp} EXP • +${coins} DD-coins`
    );


    updateHUD();


    setTimeout(
        () => {

            checkLevelUp();

            endBattle();

        },
        1200
    );

}


/* =====================================================
   LEVEL UP
   ===================================================== */

function checkLevelUp() {

    const requirements = {

        2: 100,
        3: 250,
        4: 550,
        5: 1000,
        6: 1600,
        7: 2350,
        8: 3275,
        9: 4425,
        10: 5825

    };


    while (
        player.level < 10 &&
        player.exp >=
        requirements[
            player.level + 1
        ]
    ) {

        player.level++;


        /*
           Small early-game increases.
        */

        player.maxHP += 10;

        player.attack += 2;

        player.defense += 1;

        player.speedStat += 1;


        player.hp =
            player.maxHP;

        player.energy =
            player.maxEnergy;


        notify(
            `⭐ Level ${player.level}!`
        );

    }


    updateHUD();

}


/* =====================================================
   END BATTLE
   ===================================================== */

function endBattle() {

    battleScreen.style.display =
        "none";


    defending = false;


    updateHUD();

}


/* =====================================================
   GAME OVER
   ===================================================== */

function gameOver() {

    alert(
        "Game Over!\n\nReturning to the previous checkpoint."
    );


    player.hp =
        player.maxHP;

    player.energy =
        player.maxEnergy;


    /*
       Prototype checkpoint:
       Softoy Village.
    */

    player.worldX =
        1200;

    player.worldY =
        800;


    endBattle();

    updateCamera();

}


/* =====================================================
   HUD
   ===================================================== */

function updateHUD() {

    document.getElementById(
        "hudHP"
    ).textContent =
        player.hp;


    document.getElementById(
        "hudEXP"
    ).textContent =
        player.exp;


    document.getElementById(
        "hudCoins"
    ).textContent =
        player.coins;

}


/* =====================================================
   SETTINGS
   ===================================================== */

document.getElementById(
    "settingsButton"
).onclick = () => {

    document.getElementById(
        "settingsPanel"
    ).style.display =
        "flex";

};


document.getElementById(
    "closeSettings"
).onclick = () => {

    document.getElementById(
        "settingsPanel"
    ).style.display =
        "none";

};


/* =====================================================
   MUSIC
   ===================================================== */

document.getElementById(
    "musicButton"
).onclick = () => {

    musicOn =
        !musicOn;


    document.getElementById(
        "musicButton"
    ).textContent =

        musicOn
            ? "🎵 Music: ON"
            : "🎵 Music: OFF";

};


/* =====================================================
   SAVE
   ===================================================== */

document.getElementById(
    "saveButton"
).onclick = () => {

    localStorage.setItem(
        "softoyPrototypeSave",
        JSON.stringify(
            player
        )
    );


    notify(
        "💾 Game saved!"
    );

};


/* =====================================================
   LOAD
   ===================================================== */

function loadSave() {

    const saved =
        localStorage.getItem(
            "softoyPrototypeSave"
        );


    if (!saved) {
        return;
    }


    try {

        Object.assign(
            player,
            JSON.parse(saved)
        );

    } catch {

        console.log(
            "Save unavailable."
        );

    }

}


/* =====================================================
   NOTIFICATION
   ===================================================== */

function notify(message) {

    const box =
        document.getElementById(
            "notification"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    setTimeout(
        () => {

            box.style.display =
                "none";

        },
        1800
    );

}


/* =====================================================
   START GAME
   ===================================================== */

loadSave();

updateCamera();

updateHUD();

</script>

</body>
</html>
